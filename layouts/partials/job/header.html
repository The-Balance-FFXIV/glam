{{ $role := .Page.Parent.Params.role }}
{{ $job := .Params.job_name }}

<div class="h-96 xl:h-100 bg-bottom md:bg-top bg-cover mt-5 sm:mt-0" style="background-image: url(/theme-assets/jobs/{{ (lower $role) }}/{{ (lower $job) }}/{{ (lower $job) }}_background.png);">
  <div class="responsive-container z-10 relative flex flex-wrap content-center items-center h-full">
    <div class="flex items-center md:items-center flex-row w-full lg:mb-0 lg:mt-0">
      <div>
        <img class="job-icon-header mr-4 xl:mr-8 filter drop-shadow-lg-{{ $role }}" src="/theme-assets/jobs/{{ (lower $role) }}/{{ (lower $job) }}/{{ (lower $job) }}.svg" />
      </div>
      <h1 class="text-4xl md:text-5xl xl:text-6xl font-semibold filter drop-shadow-lg-{{ $role }} mb-0">{{ .Title }}</h1>
    </div>
    <div class="mt-5 sm:mt-10 max-w-[925px] overflow-auto max-h-60">
      {{ partial "cards/default.html" (dict "text" .Content "role" $role "r" 34 "g" 37 "b" 40 "a" 0.85) }}
    </div>
  </div>
</div>
