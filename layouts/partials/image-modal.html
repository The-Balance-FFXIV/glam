<!-- The Modal -->
<dialog id="myModal" class="modal z-50" closedby="any">
  <form method="dialog">
    <button class="modal-close" type="submit">close</button>
    <div class="modal-content">
      <button style="display: contents" type="submit">
        <img class="modal-pic" id="modalPic"
             style="max-width: 100%; max-height: 80vh; margin: auto;">
      </button>
    </div>
  </form>
</dialog>
